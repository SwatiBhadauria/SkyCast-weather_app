
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="weather-card">
        <h1>Weather App ☀️</h1>
        <p class="subtitle">Discover the weather in your city</p>

        <form id="search-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="message" role="status">Search for a city to begin.</p>

        <section id="weather" hidden>
            <h2 id="city-name"></h2>
            <div id="weather-icon" class="weather-icon">🌤️</div>
            <p id="temperature" class="temperature"></p>
            <p id="condition"></p>

            <div class="details">
                <div class="detail">
                    <span>Feels like</span>
                    <strong id="feels-like"></strong>
                </div>
                <div class="detail">
                    <span>Humidity</span>
                    <strong id="humidity"></strong>
                </div>
                <div class="detail">
                    <span>Wind speed</span>
                    <strong id="wind"></strong>
                </div>
            </div>
        </section>

        <footer>
            Weather data by
            <a href="https://open-meteo.com/" target="_blank"
               rel="noreferrer">Open-Meteo</a>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
